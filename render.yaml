services:
  - type: web
    name: portfolio-api
    runtime: python
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "portfolio-yzrg.onrender.com"
      - key: DB_ENGINE
        value: "postgresql"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: EMAIL_HOST_USER
        value: "curlsjamin@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        value: "curlsjamin@gmail.com"
      - key: ADMIN_USERNAME
        value: "Christopher"
      - key: ADMIN_EMAIL
        value: "curlsjamin@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ptlio.vercel.app,https://portfolio-yzrg.onrender.com,http://localhost:8080"
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio_db
